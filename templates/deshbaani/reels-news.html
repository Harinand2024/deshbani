<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="shorts-wrap">
  <!-- REELS SLIDER -->
  <div class="swiper insta-slider p-0 m-0">
    <div class="swiper-wrapper">

     {% for truet in Reels %}
      <div class="swiper-slide mx-3">
        <a href="https://www.youtube.com/watch?v={{ truet.video_url }}"
            target="_blank">

            <div class="reelimg">
              <span class="reelplay">
                <i class="fa fa-play-circle"></i>
              </span>

              <img src="https://img.youtube.com/vi/{{ truet.video_url }}/mqdefault.jpg"
                  class="reelthumb"
                  alt="{{ truet.slug }}">
            </div>

          </a>


      </div>
      {% endfor %}

    </div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  new Swiper(".insta-slider", {
    slidesPerView: "auto",
    spaceBetween: 15,
    freeMode: true,
    grabCursor: true
  });

  Fancybox.bind('[data-fancybox="reels"]', {
    Toolbar: {
      display: ["close"]
    }
  });

});
</script>


<style>
 

/* TITLE */
.shorts-title {
  font-weight: 700;
  letter-spacing: 1px;
}

.shorts-line {
  width: 45px;
  height: 3px;
  background: #ff0003;
  display: block;
  margin-bottom: 15px;
}

/* FOLLOW CARD */
.insta-follow-link {
  text-decoration: none;
}

.insta-follow-card {
  background: linear-gradient(135deg, #000, #1b1b1b);
  border-radius: 10px;
  padding: 25px 20px;
  text-align: center;
  margin-bottom: 20px;
}

.insta-follow-card h4 {
  color: #fff;
  margin-bottom: 6px;
}

.insta-follow-card p {
  color: #ff0003;
  margin: 0;
}

/* SWIPER */
.insta-slider {
  width: 100%;
}

.swiper-wrapper {
  display: flex;
}

.swiper-slide {
  width: 240px;
  flex-shrink: 0;
}

/* REEL CARD */
.reelimg {
  aspect-ratio: 9 / 16;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.reelthumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.reelplay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  color: #fff;
  z-index: 10;
}

</style>
